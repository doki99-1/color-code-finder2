
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انتخاب رنگ</title>

    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f0f0f0;
            text-align: center;
            padding: 50px 15px;
        }

        .container {
            background-color: white;
            max-width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
        }

        input[type="color"] {
            width: 100px;
            height: 70px;
            cursor: pointer;
        }

        p {
            background-color: #eeeeee;
            padding: 10px;
            border-radius: 5px;
            direction: ltr;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>انتخاب رنگ</h2>

        <input type="color" id="colorPicker" value="#009686">

        <h3>کدهای رنگ انتخاب شده</h3>

        <p id="hex">HEX: #009686</p>
        <p id="rgb">RGB: 0, 150, 134</p>
        <p id="hsl">HSL: 174, 100%, 29%</p>
    </div>

    <script>
        const picker = document.getElementById("colorPicker");

        picker.addEventListener("input", function () {
            const hex = picker.value;

            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);

            const max = Math.max(r, g, b) / 255;
            const min = Math.min(r, g, b) / 255;

            let h = 0, s = 0;
            const l = (max + min) / 2;

            if (max !== min) {
                const d = max - min;

                s = l > 0.5
                    ? d / (2 - max - min)
                    : d / (max + min);

                switch (max) {
                    case r / 255:
                        h = (g - b) / 255 / d;
                        if (g < b) h += 6;
                        break;
                    case g / 255:
                        h = (b - r) / 255 / d + 2;
                        break;
                    case b / 255:
                        h = (r - g) / 255 / d + 4;
                        break;
                }

                h *= 60;
            }

            document.getElementById("hex").textContent =
                "HEX: " + hex.toUpperCase();

            document.getElementById("rgb").textContent =
                `RGB: ${r}, ${g}, ${b}`;

            document.getElementById("hsl").textContent =
                `HSL: ${Math.round(h)}, ${Math.round(s * 100)}%, ${Math.round(l * 100)}%`;
        });
    </script>

</body>
</html>
